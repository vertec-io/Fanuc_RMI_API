[package]
name = "fanuc_probe"
version = "0.1.0"
edition = "2021"
description = "Read-only-by-default capability sweep / protocol probe for FANUC RMI controllers"

[[bin]]
name = "fanuc_probe"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
fanuc_rmi = { path = "../fanuc_rmi" }
